# List of source channels. Copy to channels.yaml and fill in.
# Channel — username without @ (as in the link t.me/<username>).
#
# rubrics — sections of the newspaper: name and channels. Section order = order in the issue.
rubrics:
  - name: News
    channels: [example_news_channel, another_news_channel]
  - name: Bloggers
    channels: [example_blogger]
# channels — channels without a section (optional; this key alone, without
# rubrics, can be used — it's the older format).
channels:
  - example_channel
# youtube — channels for the "New videos" block (optional). id is UC..., title and
# source are filled in automatically by the setup wizard when a channel is added.
youtube:
  - id: UC_x5XG1OV2P6uZZ5FSM9Ttw
    title: Google for Developers
    source: "@GoogleDevelopers"

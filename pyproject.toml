[project]
name = "tg-newspaper"
version = "0.1.4"
description = "An agent that prints a paper newspaper from yesterday's news from Telegram channels"
authors = [
    { name = "Тимофей Русаков", email = "toptim2545@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.24.0",
    # Pinned to 1.50.0: newer Playwright versions (1.5x+) no longer ship
    # Chromium builds for macOS 12 (Monterey) — which is what runs on the
    # work machine ("ERROR: Playwright does not support chromium on mac12" on
    # 1.63.0). Only bump the version together with a macOS upgrade.
    "playwright==1.50.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "telethon>=1.45.0",
]

[project.scripts]
tg-newspaper = "tg_newspaper:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "tg-newspaper"
version = "0.1.0"
description = "Агент, который печатает бумажную газету из вчерашних новостей Telegram-каналов"
authors = [
    { name = "Тимофей Русаков", email = "toptim2545@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.24.0",
    # Закреплено на 1.50.0: более новые версии Playwright (1.5x+) больше не
    # публикуют сборки Chromium под macOS 12 (Monterey) — именно она стоит на
    # рабочем ПК ("ERROR: Playwright does not support chromium on mac12" на
    # 1.63.0). Поднимать версию — только вместе с обновлением macOS.
    "playwright==1.50.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "telethon>=1.45.0",
]

[project.scripts]
tg-newspaper = "tg_newspaper:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

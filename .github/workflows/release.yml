# Build release installers (macOS dmg and Windows setup.exe) and publish the release.
# To release: git tag v0.2.0 && git push origin v0.2.0. A manual run (workflow_dispatch)
# builds the same files as artifacts but does not create a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without v)"
        default: "0.0.1.dev0"

env:
  # Version = tag without "v", or the manual run input.
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          V="${VERSION#v}"
          # The version goes into pyproject.toml, which uv parses per PEP 440: reject invalid ones here.
          if ! echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'; then
            echo "::error::version $V is not PEP 440 compliant, examples: 0.2.0, 0.2.0rc1, 0.2.1.dev3"
            exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"
          # Substitute the version into pyproject.toml so the console shows it at the
          # bottom of the home page; the repo itself stays at 0.1.0. uv.lock is left alone: --frozen
          # doesn't check its package version against it.
          sed -i.bak "s/^version = \".*\"/version = \"$V\"/" pyproject.toml
          rm pyproject.toml.bak
          grep '^version' pyproject.toml

      - name: Build dmg
        run: scripts/build_release_mac.sh "$V" dist

      - name: Smoke test
        timeout-minutes: 15
        run: |
          set -eu
          MNT="$RUNNER_TEMP/mnt"
          mkdir -p "$MNT"
          hdiutil attach -nobrowse -mountpoint "$MNT" "dist/TG-Newspaper-$V-mac.dmg"
          TMP="$(mktemp -d)"
          cp -R "$MNT/TG Newspaper.app" "$TMP/"
          hdiutil detach "$MNT"

          export TG_NEWSPAPER_HOME="$TMP/home"
          export TG_NEWSPAPER_NO_OPEN=1
          export TG_NEWSPAPER_PORT=18420
          # First run installs the uv environment and Chromium - takes a few minutes;
          # the launcher returns once the console responds.
          "$TMP/TG Newspaper.app/Contents/MacOS/TG Newspaper" || { for f in "$TG_NEWSPAPER_HOME"/data/*.log; do echo "--- $f"; cat "$f"; done; exit 1; }

          # Fresh HOME with no settings: the home page redirects to the wizard (303) - that's success.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18420/)"
          [ "$code" = "303" ] || { echo "expected 303 on /, got $code"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18420/setup)"
          [ "$code" = "200" ] || { echo "expected 200 on /setup, got $code"; exit 1; }

          PID="$(cat "$TG_NEWSPAPER_HOME/data/console.pid")"
          curl -s -X POST -o /dev/null http://127.0.0.1:18420/shutdown
          for _ in $(seq 1 20); do
            kill -0 "$PID" 2>/dev/null || { echo "console stopped"; exit 0; }
            sleep 0.5
          done
          echo "console process did not exit after /shutdown"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/TG-Newspaper-*-mac.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version and staging
        run: |
          $v = $env:VERSION -replace '^v', ''
          # The version goes into pyproject.toml, which uv parses per PEP 440: reject invalid ones here.
          if ($v -notmatch '^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$') {
            throw "version $v is not PEP 440 compliant, examples: 0.2.0, 0.2.0rc1, 0.2.1.dev3"
          }
          "V=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Only the files needed to run, straight from git: secrets and clutter won't get in.
          # -o instead of a pipe: pwsh mangles binary output on redirection.
          git archive --format=tar -o stage.tar HEAD pyproject.toml uv.lock README.md .python-version src scripts/console.py scripts/preparing.html
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          tar -xf stage.tar -C stage
          # Version in pyproject.toml - so the console shows it at the bottom of the home page.
          $p = Join-Path $PWD 'stage\pyproject.toml'
          $t = [System.IO.File]::ReadAllText($p) -replace '(?m)^version = ".*"', "version = `"$v`""
          [System.IO.File]::WriteAllText($p, $t, (New-Object System.Text.UTF8Encoding($false)))
          Select-String -Path $p -Pattern '^version'
          # BUILD_ID: launch.ps1 uses it to decide whether the environment needs setting up.
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'stage\BUILD_ID'), "$v+$sha", (New-Object System.Text.UTF8Encoding($false)))

      - name: Check launch.ps1 syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\packaging\windows\launch.ps1", [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }

      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Build installer
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:V" "/DStageDir=$PWD\stage" "/O$PWD\dist" packaging\windows\tg-newspaper.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc exited with code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Smoke test
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'smoke'
          $installDir = Join-Path $tmp 'app'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $setup = Get-Item "dist\TG-Newspaper-$env:V-windows-setup.exe"
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$installDir" -Wait
          if (-not (Test-Path "$installDir\launch.ps1")) { throw 'installer did not place launch.ps1' }

          $env:TG_NEWSPAPER_HOME = Join-Path $tmp 'home'
          $env:TG_NEWSPAPER_NO_OPEN = '1'
          $env:TG_NEWSPAPER_PORT = '18420'
          # First run installs the uv environment and Chromium - takes a few minutes;
          # launch.ps1 returns once the console responds.
          powershell -NoProfile -ExecutionPolicy Bypass -File "$installDir\launch.ps1"
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$env:TG_NEWSPAPER_HOME\data\*.log" | ForEach-Object { "--- $_"; Get-Content $_ }
            throw "launch.ps1 exited with code $LASTEXITCODE"
          }

          # Fresh HOME with no settings: the home page redirects to the wizard, result - 200 on /setup.
          $r = Invoke-WebRequest -Uri 'http://127.0.0.1:18420/setup' -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "expected 200 on /setup, got $($r.StatusCode)" }

          $procId = [int](Get-Content "$env:TG_NEWSPAPER_HOME\data\console.pid")
          Invoke-WebRequest -Uri 'http://127.0.0.1:18420/shutdown' -Method Post -UseBasicParsing | Out-Null
          for ($i = 0; $i -lt 20; $i++) {
            if (-not (Get-Process -Id $procId -ErrorAction SilentlyContinue)) { Write-Host 'console stopped'; exit 0 }
            Start-Sleep -Milliseconds 500
          }
          throw 'console process did not exit after /shutdown'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/TG-Newspaper-*-windows-setup.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "TG Newspaper ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md
